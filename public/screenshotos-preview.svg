<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">ScreenshotOS dashboard preview</title>
  <desc id="desc">A stylised preview of the ScreenshotOS private screenshot intelligence dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111312"/>
      <stop offset="1" stop-color="#20221f"/>
    </linearGradient>
    <linearGradient id="shot1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8d8cf"/>
      <stop offset="1" stop-color="#f7f5ec"/>
    </linearGradient>
    <linearGradient id="shot2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ec8df"/>
      <stop offset=".55" stop-color="#7ba67a"/>
      <stop offset=".56" stop-color="#e8c17e"/>
    </linearGradient>
    <linearGradient id="shot3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253ad9"/>
      <stop offset="1" stop-color="#7a67ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".28"/>
    </filter>
